<!doctype html>
<!-- tools/avatar_preview.html — 開發用：把換裝圖層排成大圖檢查對齊（用本機伺服器開） -->
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>角色圖層預覽</title>
    <link rel="stylesheet" href="../style.css" />
    <style>
      body { display: block; padding: 16px; }
      #grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 1180px; }
      .cell { background: #fdf3e3; border: 1px solid #e0c9a0; padding: 4px; }
      .cell small { display: block; text-align: center; font-size: 12px; color: #7a5c3a; }
    </style>
  </head>
  <body>
    <div id="grid"></div>
    <script type="module">
      window.onerror = (m) => { document.getElementById("grid").textContent = "ERROR: " + m; };
      let renderAvatar, defaultAvatar, stageLabel;
      try {
        ({ renderAvatar, defaultAvatar, stageLabel } = await import("../js/avatar.js?t=" + Date.now()));
      } catch (e) {
        document.getElementById("grid").textContent = "IMPORT FAIL: " + e;
        throw e;
      }
      const cfg = { skin: "light", hair: "bob", hairColor: "brown", top: "sailor", bottom: "skirt", shoes: "loafer", hat: "none", accessory: "none" };
      const grid = document.getElementById("grid");
      grid.style.gridTemplateColumns = "repeat(4, 1fr)";
      grid.style.width = "1720px";
      for (const g of [4, 6, 9]) {
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.innerHTML = renderAvatar(cfg, { size: 400, grade: g }) + `<small>${g} 年級・全套</small>`;
        grid.appendChild(cell);
      }
      const bare = document.createElement("div");
      bare.className = "cell";
      bare.innerHTML =
        renderAvatar({ ...cfg, top: "none", bottom: "none", shoes: "none", hair: "none" }, { size: 400, grade: 4 }) +
        `<small>只有身體（看肩線/腰線/腳底）</small>`;
      grid.appendChild(bare);
    </script>
  </body>
</html>
