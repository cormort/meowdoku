<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>貓咪邏輯謎題｜1 貓／列・行・色塊</title>
<meta name="theme-color" content="#2f6f63">
<style>
:root{--bg:#eef3f1;--card:#fffdf9;--ink:#22322e;--muted:#5f736c;--line:#d8e2dd;--accent:#2f6f63;--accent-soft:#dfeee9;--warn:#b4553f;--gold:#c9a227;--radius:16px;--gap:10px}
:root[data-theme="dark"]{--bg:#141d1b;--card:#1c2725;--ink:#e6efec;--muted:#9db0aa;--line:#2c3a37;--accent:#6fc2ad;--accent-soft:#243a35;--warn:#e08a72;--gold:#e2c45c}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%;padding:calc(10px + env(safe-area-inset-top)) 12px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:12px;min-height:100dvh}
header{width:min(560px,100%);text-align:center}h1{margin:0;font-size:1.25rem;letter-spacing:.02em}h1 span{font-size:1.4rem}.sub{margin:4px 0 0;color:var(--muted);font-size:.78rem;line-height:1.5}
.card{width:min(560px,100%);background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 6px 20px rgba(20,40,35,.06)}
.status{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;font-size:.85rem}.status b{font-variant-numeric:tabular-nums}.hearts{letter-spacing:2px;font-size:1rem}

button{font:inherit;font-size:.82rem;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 11px;cursor:pointer;-webkit-tap-highlight-color:transparent}button:active{transform:translateY(1px)}button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}button.on{background:var(--accent-soft);border-color:var(--accent);font-weight:700}button:disabled{opacity:.45;cursor:default}

.cell{position:relative;display:flex;align-items:center;justify-content:center;font-size:calc(100cqw / var(--n,5) * .55);line-height:1;cursor:pointer;border:0;border-radius:0;background:transparent;padding:0;margin:0;min-width:0;min-height:0;overflow:hidden}.cell i{font-style:normal;pointer-events:none}.cell.mark i{color:var(--ink);opacity:.7}.cell.cat i{filter:drop-shadow(0 1px 1px rgba(0,0,0,.15))}.cell.autox i{opacity:.8}
.face{display:block;background:url("./icons/cats.webp") 0 0/900% 900% no-repeat;border-radius:18%}.cell i.face{width:86%;height:86%}
.skins{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;max-height:55vh;overflow:auto;margin-top:10px;padding:2px 2px 12px}.skins button{aspect-ratio:1/1;min-width:0;padding:3px;font-size:1.5rem;line-height:1;display:flex;align-items:center;justify-content:center}.skins button.wide{grid-column:span 3;aspect-ratio:auto;font-size:.85rem}.skins .face{width:100%;height:100%}
@media (hover:hover){.skins button{transition:transform .12s}.skins button:not(.wide):hover{transform:scale(1.5);position:relative;z-index:1;box-shadow:0 4px 14px rgba(0,0,0,.25)}}
.board.kbd .cell.cursor{outline:2px solid var(--accent);outline-offset:-3px}.cell.bad{animation:shake .3s;background:rgba(180,85,63,.25)}.cell.hint{animation:pulse 1s ease-in-out 2}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}@keyframes pulse{0%,100%{background:transparent}50%{background:var(--accent-soft)}}
.controls{display:flex;flex-wrap:wrap;gap:6px;padding:10px}.controls button{flex:1 1 auto;min-width:76px}.overlay{position:fixed;inset:0;background:rgba(12,22,20,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.overlay.hidden{display:none}.sheet{background:var(--card);color:var(--ink);border-radius:18px;padding:20px;width:min(420px,100%);text-align:center}.sheet h2{margin:0 0 6px;font-size:1.2rem}.sheet p{margin:6px 0;color:var(--muted);font-size:.86rem;line-height:1.6}.sheet .row{display:flex;gap:8px;margin-top:14px}.sheet .row button{flex:1}
.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(12,22,20,.35);z-index:30;color:#fff;font-size:.95rem;gap:10px}.loading.hidden{display:none}.spin{width:18px;height:18px;border-radius:50%;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}footer{color:var(--muted);font-size:.72rem;text-align:center;line-height:1.6;max-width:560px}kbd{background:var(--accent-soft);border-radius:5px;padding:1px 5px;font-size:.72rem}
/* 換貓動畫、音效冷卻與手機修正 */
html.skin-animation-lock,body.skin-animation-lock{overflow:hidden;overscroll-behavior:none;touch-action:none;scrollbar-gutter:stable}
#skinBtn.skin-cooldown{position:relative;overflow:hidden;cursor:not-allowed;opacity:.72;border-color:var(--line);color:var(--muted)}#skinBtn.skin-cooldown::before{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 24%,transparent),color-mix(in srgb,var(--accent) 8%,transparent));transform-origin:left center;transform:scaleX(var(--cooldown-progress,1));pointer-events:none}#skinBtn>span{position:relative;z-index:1}
.skins button.skin-choosing{position:relative;z-index:2;transform:scale(.86);opacity:.42;transition:transform .15s ease,opacity .15s ease}
.skin-effects-layer{position:fixed;inset:0;z-index:9999;width:100%;height:100%;overflow:visible;pointer-events:none;contain:layout style;transform:translateZ(0)}
.skin-fly-preview{position:absolute;left:0;top:0;z-index:5;display:flex;align-items:center;justify-content:center;margin:0;padding:3px;overflow:hidden;pointer-events:none;background:var(--card);border:2px solid var(--accent);border-radius:18%;box-shadow:0 8px 26px rgba(0,0,0,.34),0 0 0 4px color-mix(in srgb,var(--accent) 20%,transparent),0 0 24px color-mix(in srgb,var(--accent) 58%,transparent);transform-origin:center;will-change:transform,opacity,filter;backface-visibility:hidden}.skin-fly-preview .face{width:100%;height:100%;border-radius:14%}.skin-fly-preview .fly-emoji{display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-size:clamp(28px,9vw,46px);line-height:1}
.skin-trail-dot,.skin-paw-trail,.skin-arrival-particle,.skin-arrival-ring{position:absolute;left:0;top:0;pointer-events:none;transform:translate3d(-50%,-50%,0)}
.skin-trail-dot{z-index:2;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle,#fff 0 18%,var(--gold) 20% 44%,var(--accent) 48% 70%,transparent 74%);box-shadow:0 0 7px var(--gold),0 0 14px var(--accent);animation:skinTrailFade .48s ease-out forwards}@keyframes skinTrailFade{to{opacity:0;transform:translate3d(-50%,-50%,0) scale(.12)}}
.skin-paw-trail{z-index:3;color:var(--gold);font-size:15px;line-height:1;filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 6px var(--gold));animation:skinPawFade .66s ease-out forwards}@keyframes skinPawFade{0%{opacity:.95;transform:translate3d(-50%,-50%,0) scale(.66) rotate(var(--paw-rotate,0deg))}100%{opacity:0;transform:translate3d(-50%,-105%,0) scale(.32) rotate(var(--paw-rotate,0deg))}}
.skin-arrival-particle{z-index:6;width:8px;height:8px;border-radius:50%;background:var(--particle-color,var(--gold));box-shadow:0 0 6px var(--particle-color,var(--gold)),0 0 12px var(--particle-color,var(--gold));animation:skinParticleBurst .62s ease-out forwards}@keyframes skinParticleBurst{to{opacity:0;transform:translate3d(-50%,-50%,0) translate3d(var(--particle-x),var(--particle-y),0) scale(.12)}}
.skin-arrival-ring{z-index:1;width:24px;height:24px;border:3px solid var(--accent);border-radius:50%;box-shadow:0 0 12px var(--accent),inset 0 0 12px var(--gold);animation:skinArrivalRing .58s ease-out forwards}@keyframes skinArrivalRing{from{opacity:.95;transform:translate3d(-50%,-50%,0) scale(.3)}to{opacity:0;transform:translate3d(-50%,-50%,0) scale(3.8)}}
.board.skin-arrive{animation:boardSkinArrive .42s cubic-bezier(.2,.9,.3,1)}@keyframes boardSkinArrive{0%,100%{transform:scale(1);filter:brightness(1)}35%{transform:scale(.978);filter:brightness(1.14)}68%{transform:scale(1.012);filter:brightness(1.07)}}.cell.cat.skin-target{z-index:3;overflow:visible}.cell.cat.skin-target i{animation:skinTargetArrive .56s cubic-bezier(.18,.9,.28,1)}@keyframes skinTargetArrive{0%{opacity:.45;transform:scale(.65) rotate(-7deg)}48%{opacity:1;transform:scale(1.35) rotate(5deg)}72%{transform:scale(.92) rotate(-2deg)}100%{transform:scale(1)}}.cell.cat.skin-updated i{animation:catSkinUpdated .42s cubic-bezier(.2,.9,.3,1) both}@keyframes catSkinUpdated{0%{transform:scale(.75);opacity:.5}58%{transform:scale(1.17);opacity:1}100%{transform:scale(1);opacity:1}}
@media (max-width:600px),(hover:none),(pointer:coarse){body{isolation:isolate}.overlay{backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}.skin-fly-preview{padding:2px;box-shadow:0 7px 20px rgba(0,0,0,.3),0 0 0 3px var(--accent)}.skin-trail-dot{width:8px;height:8px}.skin-paw-trail{font-size:13px}}
@media (max-width:400px){.status{font-size:.78rem;padding:8px 10px}}
@media (prefers-reduced-motion:reduce){.skin-trail-dot,.skin-paw-trail,.skin-arrival-particle,.skin-arrival-ring{display:none!important}.board.skin-arrive,.cell.cat.skin-target i,.cell.cat.skin-updated i{animation:none!important}.skins button.skin-choosing{transition:none}}


/* =========================================================
   手機操作版面與動畫效能優化
   ========================================================= */
:root{
  --tap-size:44px;
  --mobile-controls-height:76px;
}
button{min-height:var(--tap-size);touch-action:manipulation}
button:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,white);outline-offset:2px}

/* 動畫元素隔離，降低重繪範圍 */
.skin-effects-layer{contain:strict;isolation:isolate}
.skin-fly-preview,.skin-trail-dot,.skin-paw-trail,.skin-arrival-particle,.skin-arrival-ring{
  contain:layout style paint;
  transform-style:preserve-3d;
}
.board,.cell,.face{backface-visibility:hidden;-webkit-backface-visibility:hidden}

/* 手機介面 */
@media (max-width:600px),(hover:none) and (pointer:coarse){
  :root{--radius:14px;--tap-size:46px}
  html{scroll-padding-bottom:calc(var(--mobile-controls-height) + env(safe-area-inset-bottom) + 12px)}
  body{
    display:block;
    min-height:100dvh;
    padding:calc(6px + env(safe-area-inset-top)) 8px
      calc(var(--mobile-controls-height) + env(safe-area-inset-bottom) + 18px);
  }
  header,.card,footer{width:100%;max-width:560px;margin-left:auto;margin-right:auto}
  header{padding:2px 2px 4px}
  h1{font-size:1.08rem;line-height:1.25}
  h1 span{font-size:1.2rem}
  .sub{font-size:.72rem;line-height:1.38;margin-top:2px}

  /* 難度與功能縮成穩定的三欄按鈕 */
  .levels{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:6px;
    padding:7px;
    margin-top:5px;
  }
  .levels button{
    width:100%;
    min-width:0;
    min-height:44px;
    padding:6px 4px;
    font-size:.75rem;
    line-height:1.15;
  }

  /* 狀態列固定一行，減少棋盤上方高度 */
  .status{
    display:grid;
    grid-template-columns:1.2fr .9fr .8fr 1fr;
    gap:3px;
    padding:7px 8px;
    margin-top:6px;
    font-size:.72rem;
    text-align:center;
  }
  .status>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hearts{font-size:.86rem;letter-spacing:0}

  /* 棋盤盡可能放大，並避免點擊後畫面縮放 */
  .boardWrap{padding:6px;margin-top:6px}
  .board{border-width:2px;border-radius:10px;touch-action:manipulation}
  .cell{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  .cell:active{filter:brightness(.94)}

  /* 主要操作固定在底部，拇指可直接碰到 */
  .controls{
    position:fixed;
    left:0;right:0;bottom:0;
    z-index:15;
    display:grid;
    grid-template-columns:repeat(5,minmax(0,1fr));
    gap:5px;
    width:100%;
    max-width:none;
    min-height:var(--mobile-controls-height);
    padding:7px max(8px,env(safe-area-inset-right))
      calc(7px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));
    border:0;
    border-top:1px solid var(--line);
    border-radius:16px 16px 0 0;
    background:color-mix(in srgb,var(--card) 94%,transparent);
    box-shadow:0 -8px 24px rgba(20,40,35,.16);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
  }
  .controls button{
    min-width:0;
    min-height:50px;
    padding:5px 2px;
    font-size:.71rem;
    line-height:1.1;
    border-radius:10px;
  }
  /* 手機底欄只保留最常用的五個動作 */
  #autoXBtn,#restartBtn{display:none}
  #newBtn{font-size:0}
  #newBtn::after{content:'🎲 新題';font-size:.71rem}

  footer{padding:10px 8px 4px;font-size:.66rem}
  footer p:first-child{display:none}

  /* 換貓改為底部抽屜，避免鍵盤式彈窗擋住棋盤 */
  .overlay{align-items:flex-end;padding:0;background:rgba(12,22,20,.4);backdrop-filter:none;-webkit-backdrop-filter:none}
  .sheet{
    width:100%;
    max-width:560px;
    max-height:min(78dvh,650px);
    padding:13px 12px calc(12px + env(safe-area-inset-bottom));
    border-radius:20px 20px 0 0;
    box-shadow:0 -12px 34px rgba(0,0,0,.28);
    overflow:hidden;
  }
  .sheet h2{font-size:1.05rem;margin-bottom:3px}
  .sheet p{font-size:.78rem;line-height:1.4}
  .sheet .row{margin-top:8px}
  .skins{
    grid-template-columns:repeat(6,minmax(0,1fr));
    gap:7px;
    max-height:calc(min(78dvh,650px) - 116px);
    padding:4px 2px 14px;
    overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
  }
  .skins button{min-height:0;border-radius:12px}
  .skins button.wide{min-height:44px}

  /* 手機減少昂貴的陰影與模糊 */
  .skin-fly-preview{box-shadow:0 5px 14px rgba(0,0,0,.25),0 0 0 2px var(--accent)}
  .skin-trail-dot{box-shadow:0 0 5px var(--gold)}
  .skin-paw-trail{filter:none}
  .skin-arrival-particle{box-shadow:0 0 4px var(--particle-color,var(--gold))}
}

@media (max-width:370px){
  .sub br{display:none}
  .levels button{font-size:.69rem}
  .status{font-size:.67rem;padding-left:5px;padding-right:5px}
  .controls button{font-size:.65rem}
  #newBtn::after{font-size:.65rem}
}

/* 低效能模式由 JavaScript 自動加入 */
html.low-fx .skin-paw-trail{display:none!important}
html.low-fx .skin-trail-dot{box-shadow:none;width:6px!important;height:6px!important}
html.low-fx .skin-arrival-particle:nth-of-type(n+9){display:none!important}
html.low-fx .board.skin-arrive{animation-duration:.28s}

</style>
</head>
<body>
<header><h1><span>🐾</span> 貓咪邏輯謎題</h1><p class="sub">每個色塊 1 隻貓・每列 1 隻・每行 1 隻・貓不能相鄰（含斜角）<br>每題唯一解，純靠邏輯推導，不用猜</p></header>
<section class="card levels"><button data-n="5">5×5 簡單</button><button data-n="7">7×7 普通</button><button data-n="9">9×9 困難</button><button id="dailyBtn">📅 每日挑戰</button><button id="themeBtn" title="切換深色／淺色">🌙</button><button id="skinBtn" title="更換貓咪圖示"><span id="skinBtnLabel">🐱 換貓</span></button></section>
<section class="card"><div class="status"><span class="hearts" id="hearts">🐟🐟🐟</span><span>⏱ <b id="timer">00:00</b></span><span>🐱 <b id="progress">0/5</b></span><span id="bestLabel">🏆 --:--</span></div></section>
<section class="card boardWrap"><div class="board" id="board" role="grid" aria-label="謎題盤面"></div></section>
<section class="card controls"><button id="modeMarkBtn" class="on">✕ 排除</button><button id="modeCatBtn">🐱 放貓</button><button id="hintBtn" aria-label="顯示提示">💡 提示</button><button id="undoBtn" aria-label="復原上一步">↶ 復原</button><button id="autoXBtn" class="on">自動打叉</button><button id="restartBtn">↻ 重來</button><button id="newBtn" class="primary">🎲 新題目</button></section>
<footer><p>點格子＝依目前模式動作；<b>長按或右鍵</b>可清除單格。放錯貓會扣 1 條小魚乾。<br>鍵盤：<kbd>方向鍵</kbd>移動、<kbd>X</kbd> 打叉、<kbd>C</kbd> 放貓、<kbd>Backspace</kbd> 清除。</p><p>已針對手機觸控與動畫效能最佳化；題目由完整核心引擎生成與驗證。</p></footer>
<div class="overlay hidden" id="overlay"><div class="sheet"><h2 id="overlayTitle">完成！</h2><p id="overlayBody"></p><div class="row"><button id="overlayPrimary" class="primary">下一題</button><button id="overlaySecondary">關閉</button></div></div></div>
<div class="loading hidden" id="loading"><span class="spin"></span><span id="loadingText">生成題目中…</span></div>
<script type="module">

import {makeRng,hashSeed,generatePuzzle,logicSolve,findConflicts,isSolved,aroundNeighbors,rowColOf,indexOf} from './engine.js?v=3';
const $=id=>document.getElementById(id);
const LS={best:n=>`meowdoku.best.${n}`,theme:'meowdoku.theme',autoX:'meowdoku.autoX',daily:'meowdoku.daily',resume:'meowdoku.resume',skin:'meowdoku.skin',sound:'meowdoku.sound'};
const MARK='✕',CAT='🐱';
const REGION_COLORS=['#f8c4c0','#fbd5a5','#f5e98f','#c3e6aa','#a6ded3','#b7d2f5','#d0c5f4','#f4c0df','#dcc8ae'];
const REGION_COLORS_DARK=['#6a2a2a','#6b3f14','#5e5414','#2f5a1c','#145a4e','#1e3f73','#432f7a','#652050','#4e3d2a'];
const state={n:5,owner:[],solution:[],cells:[],lives:3,mode:'mark',autoX:true,skin:'emoji',startedAt:0,elapsed:0,timer:null,done:false,daily:false,dailyKey:null,history:[],cursor:0,hints:0,autoMarked:new Set()};
function regionColor(r){return(document.documentElement.dataset.theme==='dark'?REGION_COLORS_DARK:REGION_COLORS)[r%9]}
function renderBoard(){const board=$('board'),n=state.n;board.style.setProperty('--n',n);board.style.gridTemplateColumns=`repeat(${n},minmax(0,1fr))`;board.style.gridTemplateRows=`repeat(${n},minmax(0,1fr))`;board.replaceChildren();for(let i=0;i<n*n;i++){const cell=document.createElement('button');cell.className='cell';cell.dataset.i=i;cell.type='button';cell.setAttribute('role','gridcell');const[r,c]=rowColOf(n,i),thick='3px solid var(--ink)',thin='1px solid rgba(60,80,72,.35)';cell.style.background=regionColor(state.owner[i]);cell.style.cssText+=`;border-top:${r===0||state.owner[i-n]!==state.owner[i]?thick:thin};border-bottom:${r===n-1||state.owner[i+n]!==state.owner[i]?thick:thin};border-left:${c===0||state.owner[i-1]!==state.owner[i]?thick:thin};border-right:${c===n-1||state.owner[i+1]!==state.owner[i]?thick:thin}`;cell.innerHTML='<i></i>';board.append(cell)}paintCells()}

$('autoXBtn').onclick=()=>{state.autoX=!state.autoX;localStorage.setItem(LS.autoX,state.autoX?'1':'0');$('autoXBtn').classList.toggle('on',state.autoX);$('autoXBtn').textContent=state.autoX?'自動打叉':'自動打叉：關';if(!state.autoX){clearAutoMarks();paintCells()}};$('themeBtn').onclick=()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';localStorage.setItem(LS.theme,dark?'dark':'light');$('themeBtn').textContent=dark?'☀️':'🌙';renderBoard()};$('dailyBtn').onclick=()=>{const key=todayKey();newGame({n:7,daily:true,seed:hashSeed(key)})};$('overlaySecondary').onclick=hideSheet;$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))hideSheet()});

$('overlayBody').addEventListener('click',async e=>{const button=e.target.closest('[data-skin]');if(!button||skinSelecting||getSkinCooldownRemaining())return;skinSelecting=true;const selected=button.dataset.skin;getSkinAudioContext();try{const target=await animateSkinToLastCat(button,selected);state.skin=selected;localStorage.setItem(LS.skin,state.skin);paintCells();const current={...target,cell:target.index>=0?$('board').children[target.index]:null};animateSkinArrival(current);animateBoardCats(target.index);startSkinCooldown()}catch(err){console.error('換貓動畫失敗',err);unlockView();clearSkinEffects();state.skin=selected;localStorage.setItem(LS.skin,state.skin);paintCells();hideSheet();startSkinCooldown()}finally{setTimeout(()=>skinSelecting=false,220);setTimeout(clearSkinEffects,1100)}});
document.addEventListener('keydown',e=>{if(state.done)return;const n=state.n,[r,c]=rowColOf(n,state.cursor);if(e.key==='ArrowLeft'){state.cursor=indexOf(n,r,Math.max(0,c-1));paintCells();e.preventDefault()}else if(e.key==='ArrowRight'){state.cursor=indexOf(n,r,Math.min(n-1,c+1));paintCells();e.preventDefault()}else if(e.key==='ArrowUp'){state.cursor=indexOf(n,Math.max(0,r-1),c);paintCells();e.preventDefault()}else if(e.key==='ArrowDown'){state.cursor=indexOf(n,Math.min(n-1,r+1),c);paintCells();e.preventDefault()}else if(/[xX]/.test(e.key)){setMode('mark');tapCell(state.cursor)}else if(/[cC]/.test(e.key)){setMode('cat');tapCell(state.cursor)}else if(e.key==='Backspace'||e.key==='Delete'){clearCell(state.cursor);e.preventDefault()}else if(/[hH]/.test(e.key))giveHint()});
window.__meowdoku={state,newGame,tapCell,clearCell,setMode,giveHint,catsOnBoard,board:()=>$('board'),todayKey};
(function boot(){const theme=localStorage.getItem(LS.theme);if(theme){document.documentElement.dataset.theme=theme;$('themeBtn').textContent=theme==='dark'?'☀️':'🌙'}else if(matchMedia('(prefers-color-scheme:dark)').matches){document.documentElement.dataset.theme='dark';$('themeBtn').textContent='☀️'}state.skin=localStorage.getItem(LS.skin)||'emoji';const autoX=localStorage.getItem(LS.autoX);state.autoX=autoX===null?true:autoX==='1';$('autoXBtn').classList.toggle('on',state.autoX);$('autoXBtn').textContent=state.autoX?'自動打叉':'自動打叉：關';setMode(localStorage.getItem('meowdoku.mode')==='cat'?'cat':'mark');if(!loadResume())newGame({n:5});else if(state.daily&&state.dailyKey!==todayKey())newGame({n:5});updateSkinCooldownButton();if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});})();
</script>
</body>
</html>
