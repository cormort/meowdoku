<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>貓咪邏輯謎題｜1 貓／列・行・色塊</title>
    <meta name="theme-color" content="#2f6f63" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="貓咪謎題" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <style>
      :root {
        --bg: #eef3f1;
        --card: #fffdf9;
        --ink: #22322e;
        --muted: #5f736c;
        --line: #d8e2dd;
        --accent: #2f6f63;
        --accent-soft: #dfeee9;
        --warn: #b4553f;
        --gold: #c9a227;
        --radius: 16px;
        --gap: 10px;
      }
      :root[data-theme="dark"] {
        --bg: #141d1b;
        --card: #1c2725;
        --ink: #e6efec;
        --muted: #9db0aa;
        --line: #2c3a37;
        --accent: #6fc2ad;
        --accent-soft: #243a35;
        --warn: #e08a72;
        --gold: #e2c45c;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC",
          "Microsoft JhengHei", sans-serif;
        background: var(--bg);
        color: var(--ink);
        -webkit-text-size-adjust: 100%;
        padding: calc(10px + env(safe-area-inset-top)) 12px calc(18px + env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        min-height: 100dvh;
      }
      header {
        width: min(560px, 100%);
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 1.25rem;
        letter-spacing: 0.02em;
      }
      h1 span {
        font-size: 1.4rem;
      }
      .sub {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 0.78rem;
        line-height: 1.5;
      }
      .card {
        width: min(560px, 100%);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: 0 6px 20px rgba(20, 40, 35, 0.06);
      }
      .status {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 10px 14px;
        font-size: 0.85rem;
      }
      .status b {
        font-variant-numeric: tabular-nums;
      }
      .hearts {
        letter-spacing: 2px;
        font-size: 1rem;
      }
      .levels {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 10px;
        justify-content: center;
      }
      .levels button {
        flex: 1 1 30%;
        min-width: 0;
      }
      button {
        font: inherit;
        font-size: 0.82rem;
        color: var(--ink);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 11px;
        padding: 9px 11px;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      button:active {
        transform: translateY(1px);
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        font-weight: 700;
      }
      button.on {
        background: var(--accent-soft);
        border-color: var(--accent);
        font-weight: 700;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .boardWrap {
        width: min(560px, 100%);
        padding: 10px;
      }
      .board {
        position: relative;
        display: grid;
        gap: 0;
        aspect-ratio: 1/1;
        width: 100%;
        border-radius: 12px;
        overflow: hidden;
        background: var(--card);
        border: 3px solid var(--ink);
        user-select: none;
        touch-action: manipulation;
        container-type: inline-size;
      }
      .cell {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: calc(100cqw / var(--n, 5) * 0.55);
        line-height: 1;
        cursor: pointer;
        border: 0;
        border-radius: 0;
        background: transparent;
        padding: 0;
        margin: 0;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }
      .cell i {
        font-style: normal;
        pointer-events: none;
      }
      .cell.mark i {
        color: var(--ink);
        opacity: 0.7;
      }
      .cell.cat i {
        filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.15));
      }
      .cell.autox i {
        opacity: 0.8;
      }
      .face {
        display: block;
        background: url("./icons/cats.webp") 0 0/900% 900% no-repeat;
        border-radius: 18%;
      }
      .cell i.face {
        width: 86%;
        height: 86%;
      }
      .skins {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 6px;
        max-height: 55vh;
        overflow: auto;
        margin-top: 10px;
        padding: 2px 2px 12px;
      }
      .skins button {
        aspect-ratio: 1/1;
        min-width: 0;
        padding: 3px;
        font-size: 1.5rem;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .skins button.wide {
        grid-column: span 3;
        aspect-ratio: auto;
        font-size: 0.85rem;
      }
      .skins .face {
        width: 100%;
        height: 100%;
      }
      @media (hover: hover) {
        .skins button {
          transition: transform 0.12s;
        }
        .skins button:not(.wide):hover {
          transform: scale(1.5);
          position: relative;
          z-index: 1;
          box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
        }
      }
      .board.kbd .cell.cursor {
        outline: 2px solid var(--accent);
        outline-offset: -3px;
      }
      .cell.bad {
        animation: shake 0.3s;
        background: rgba(180, 85, 63, 0.25);
      }
      .cell.hint {
        animation: pulse 1s ease-in-out 2;
      }
      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-3px);
        }
        75% {
          transform: translateX(3px);
        }
      }
      @keyframes pulse {
        0%,
        100% {
          background: transparent;
        }
        50% {
          background: var(--accent-soft);
        }
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 10px;
      }
      .controls button {
        flex: 1 1 auto;
        min-width: 76px;
      }
      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(12, 22, 20, 0.55);
        backdrop-filter: blur(3px);
        -webkit-backdrop-filter: blur(3px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 20;
      }
      .overlay.hidden {
        display: none;
      }
      .sheet {
        background: var(--card);
        color: var(--ink);
        border-radius: 18px;
        padding: 20px;
        width: min(420px, 100%);
        text-align: center;
        /* 內容過長時只捲動中間區塊，標題與按鈕固定可見 */
        display: flex;
        flex-direction: column;
        max-height: calc(100dvh - 40px);
      }
      .sheet > h2,
      .sheet > .row {
        flex-shrink: 0;
      }
      #overlayBody {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
      }
      .sheet h2 {
        margin: 0 0 6px;
        font-size: 1.2rem;
      }
      .sheet p {
        margin: 6px 0;
        color: var(--muted);
        font-size: 0.86rem;
        line-height: 1.6;
      }
      .sheet .row {
        display: flex;
        gap: 8px;
        margin-top: 14px;
      }
      .sheet .row button {
        flex: 1;
      }
      .loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(12, 22, 20, 0.35);
        z-index: 30;
        color: #fff;
        font-size: 0.95rem;
        gap: 10px;
      }
      .loading.hidden {
        display: none;
      }
      .spin {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.35);
        border-top-color: #fff;
        animation: sp 1s linear infinite;
      }
      @keyframes sp {
        to {
          transform: rotate(360deg);
        }
      }
      footer {
        color: var(--muted);
        font-size: 0.72rem;
        text-align: center;
        line-height: 1.6;
        max-width: 560px;
      }
      kbd {
        background: var(--accent-soft);
        border-radius: 5px;
        padding: 1px 5px;
        font-size: 0.72rem;
      }
      /* 換貓動畫、音效冷卻與手機修正 */
      html.skin-animation-lock,
      body.skin-animation-lock {
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        scrollbar-gutter: stable;
      }
      #skinBtn.skin-cooldown {
        position: relative;
        overflow: hidden;
        cursor: not-allowed;
        opacity: 0.72;
        border-color: var(--line);
        color: var(--muted);
      }
      #skinBtn.skin-cooldown::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 0;
        background: linear-gradient(
          90deg,
          color-mix(in srgb, var(--accent) 24%, transparent),
          color-mix(in srgb, var(--accent) 8%, transparent)
        );
        transform-origin: left center;
        transform: scaleX(var(--cooldown-progress, 1));
        pointer-events: none;
      }
      #skinBtn > span {
        position: relative;
        z-index: 1;
      }
      .skins button.skin-choosing {
        position: relative;
        z-index: 2;
        transform: scale(0.92);
        opacity: 0.55;
        transition:
          transform 0.15s ease,
          opacity 0.15s ease;
      }
      .skin-effects-layer {
        position: fixed;
        inset: 0;
        z-index: 9999;
        width: 100%;
        height: 100%;
        overflow: visible;
        pointer-events: none;
        contain: layout style;
        transform: translateZ(0);
      }
      .skin-fly-preview {
        position: absolute;
        left: 0;
        top: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        padding: 3px;
        overflow: hidden;
        pointer-events: none;
        background: var(--card);
        border: 2px solid var(--accent);
        border-radius: 18%;
        box-shadow:
          0 8px 26px rgba(0, 0, 0, 0.34),
          0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent),
          0 0 24px color-mix(in srgb, var(--accent) 58%, transparent);
        transform-origin: center;
        will-change: transform, opacity, filter;
        backface-visibility: hidden;
      }
      .skin-fly-preview .face {
        width: 100%;
        height: 100%;
        border-radius: 14%;
      }
      .skin-fly-preview .fly-emoji {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        font-size: clamp(28px, 9vw, 46px);
        line-height: 1;
      }
      .skin-trail-dot,
      .skin-paw-trail,
      .skin-arrival-particle,
      .skin-arrival-ring {
        position: absolute;
        left: 0;
        top: 0;
        pointer-events: none;
        transform: translate3d(-50%, -50%, 0);
      }
      .skin-trail-dot {
        z-index: 2;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          #fff 0 18%,
          var(--gold) 20% 44%,
          var(--accent) 48% 70%,
          transparent 74%
        );
        box-shadow:
          0 0 7px var(--gold),
          0 0 14px var(--accent);
        animation: skinTrailFade 0.48s ease-out forwards;
      }
      @keyframes skinTrailFade {
        to {
          opacity: 0;
          transform: translate3d(-50%, -50%, 0) scale(0.12);
        }
      }
      .skin-paw-trail {
        z-index: 3;
        color: var(--gold);
        font-size: 15px;
        line-height: 1;
        filter: drop-shadow(0 0 3px #fff) drop-shadow(0 0 6px var(--gold));
        animation: skinPawFade 0.66s ease-out forwards;
      }
      @keyframes skinPawFade {
        0% {
          opacity: 0.95;
          transform: translate3d(-50%, -50%, 0) scale(0.66) rotate(var(--paw-rotate, 0deg));
        }
        100% {
          opacity: 0;
          transform: translate3d(-50%, -105%, 0) scale(0.32) rotate(var(--paw-rotate, 0deg));
        }
      }
      .skin-arrival-particle {
        z-index: 6;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--particle-color, var(--gold));
        box-shadow:
          0 0 6px var(--particle-color, var(--gold)),
          0 0 12px var(--particle-color, var(--gold));
        animation: skinParticleBurst 0.62s ease-out forwards;
      }
      @keyframes skinParticleBurst {
        to {
          opacity: 0;
          transform: translate3d(-50%, -50%, 0) translate3d(var(--particle-x), var(--particle-y), 0)
            scale(0.12);
        }
      }
      .skin-arrival-ring {
        z-index: 1;
        width: 24px;
        height: 24px;
        border: 3px solid var(--accent);
        border-radius: 50%;
        box-shadow:
          0 0 12px var(--accent),
          inset 0 0 12px var(--gold);
        animation: skinArrivalRing 0.58s ease-out forwards;
      }
      @keyframes skinArrivalRing {
        from {
          opacity: 0.95;
          transform: translate3d(-50%, -50%, 0) scale(0.3);
        }
        to {
          opacity: 0;
          transform: translate3d(-50%, -50%, 0) scale(3.8);
        }
      }
      .board.skin-arrive {
        animation: boardSkinArrive 0.42s cubic-bezier(0.2, 0.9, 0.3, 1);
      }
      @keyframes boardSkinArrive {
        0%,
        100% {
          transform: scale(1);
          filter: brightness(1);
        }
        35% {
          transform: scale(0.978);
          filter: brightness(1.14);
        }
        68% {
          transform: scale(1.012);
          filter: brightness(1.07);
        }
      }
      .cell.cat.skin-target {
        z-index: 3;
        overflow: visible;
      }
      .cell.cat.skin-target i {
        animation: skinTargetArrive 0.56s cubic-bezier(0.18, 0.9, 0.28, 1);
      }
      @keyframes skinTargetArrive {
        0% {
          opacity: 0.45;
          transform: scale(0.65) rotate(-7deg);
        }
        48% {
          opacity: 1;
          transform: scale(1.35) rotate(5deg);
        }
        72% {
          transform: scale(0.92) rotate(-2deg);
        }
        100% {
          transform: scale(1);
        }
      }
      .cell.cat.skin-updated i {
        animation: catSkinUpdated 0.42s cubic-bezier(0.2, 0.9, 0.3, 1) both;
      }
      @keyframes catSkinUpdated {
        0% {
          transform: scale(0.75);
          opacity: 0.5;
        }
        58% {
          transform: scale(1.17);
          opacity: 1;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }
      @media (max-width: 600px), (hover: none), (pointer: coarse) {
        body {
          isolation: isolate;
        }
        .overlay {
          backdrop-filter: blur(2px);
          -webkit-backdrop-filter: blur(2px);
        }
        .skin-fly-preview {
          padding: 2px;
          box-shadow:
            0 7px 20px rgba(0, 0, 0, 0.3),
            0 0 0 3px var(--accent);
        }
        .skin-trail-dot {
          width: 8px;
          height: 8px;
        }
        .skin-paw-trail {
          font-size: 13px;
        }
      }
      @media (max-width: 400px) {
        .status {
          font-size: 0.78rem;
          padding: 8px 10px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .skin-trail-dot,
        .skin-paw-trail,
        .skin-arrival-particle,
        .skin-arrival-ring {
          display: none !important;
        }
        .board.skin-arrive,
        .cell.cat.skin-target i,
        .cell.cat.skin-updated i {
          animation: none !important;
        }
        .skins button.skin-choosing {
          transition: none;
        }
      }

      /* =========================================================
   手機操作版面與動畫效能優化
   ========================================================= */
      :root {
        --tap-size: 44px;
        --mobile-controls-height: 76px;
      }
      button {
        min-height: var(--tap-size);
        touch-action: manipulation;
      }
      button:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--accent) 55%, white);
        outline-offset: 2px;
      }

      /* 動畫元素隔離，降低重繪範圍 */
      .skin-effects-layer {
        contain: strict;
        isolation: isolate;
      }
      .skin-fly-preview,
      .skin-trail-dot,
      .skin-paw-trail,
      .skin-arrival-particle,
      .skin-arrival-ring {
        contain: layout style paint;
        transform-style: preserve-3d;
      }
      .board,
      .cell,
      .face {
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }

      /* 手機介面 */
      @media (max-width: 600px), (hover: none) and (pointer: coarse) {
        :root {
          --radius: 14px;
          --tap-size: 46px;
        }
        html {
          scroll-padding-bottom: calc(
            var(--mobile-controls-height) + env(safe-area-inset-bottom) + 12px
          );
        }
        body {
          display: block;
          min-height: 100dvh;
          padding: calc(6px + env(safe-area-inset-top)) 8px
            calc(var(--mobile-controls-height) + env(safe-area-inset-bottom) + 18px);
        }
        header,
        .card,
        footer {
          width: 100%;
          max-width: 560px;
          margin-left: auto;
          margin-right: auto;
        }
        header {
          padding: 2px 2px 4px;
        }
        h1 {
          font-size: 1.08rem;
          line-height: 1.25;
        }
        h1 span {
          font-size: 1.2rem;
        }
        .sub {
          font-size: 0.72rem;
          line-height: 1.38;
          margin-top: 2px;
        }

        /* 難度與功能縮成穩定的三欄按鈕 */
        .levels {
          display: grid;
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 6px;
          padding: 7px;
          margin-top: 5px;
        }
        .levels button {
          width: 100%;
          min-width: 0;
          min-height: 44px;
          padding: 6px 4px;
          font-size: 0.75rem;
          line-height: 1.15;
        }

        /* 狀態列固定一行，減少棋盤上方高度 */
        .status {
          display: grid;
          grid-template-columns: 1.2fr 0.9fr 0.8fr 1fr;
          gap: 3px;
          padding: 7px 8px;
          margin-top: 6px;
          font-size: 0.72rem;
          text-align: center;
        }
        .status > span {
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        .hearts {
          font-size: 0.86rem;
          letter-spacing: 0;
        }

        /* 棋盤盡可能放大，並避免點擊後畫面縮放 */
        .boardWrap {
          padding: 6px;
          margin-top: 6px;
        }
        .board {
          border-width: 2px;
          border-radius: 10px;
          touch-action: manipulation;
        }
        .cell {
          touch-action: manipulation;
          -webkit-user-select: none;
          user-select: none;
        }
        .cell:active {
          filter: brightness(0.94);
        }

        /* 主要操作固定在底部，拇指可直接碰到 */
        .controls {
          position: fixed;
          left: 0;
          right: 0;
          bottom: 0;
          z-index: 15;
          display: grid;
          grid-template-columns: repeat(5, minmax(0, 1fr));
          gap: 5px;
          width: 100%;
          max-width: none;
          min-height: var(--mobile-controls-height);
          padding: 7px max(8px, env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom))
            max(8px, env(safe-area-inset-left));
          border: 0;
          border-top: 1px solid var(--line);
          border-radius: 16px 16px 0 0;
          background: color-mix(in srgb, var(--card) 94%, transparent);
          box-shadow: 0 -8px 24px rgba(20, 40, 35, 0.16);
          backdrop-filter: blur(10px);
          -webkit-backdrop-filter: blur(10px);
        }
        .controls button {
          min-width: 0;
          min-height: 50px;
          padding: 5px 2px;
          font-size: 0.71rem;
          line-height: 1.1;
          border-radius: 10px;
        }
        /* 手機底欄只保留最常用的五個動作 */
        #autoXBtn,
        #restartBtn {
          display: none;
        }
        #newBtn {
          font-size: 0;
        }
        #newBtn::after {
          content: "🎲 新題";
          font-size: 0.71rem;
        }

        footer {
          padding: 10px 8px 4px;
          font-size: 0.66rem;
        }
        footer p:first-child {
          display: none;
        }

        /* 換貓改為底部抽屜，避免鍵盤式彈窗擋住棋盤 */
        .overlay {
          align-items: flex-end;
          padding: 0;
          background: rgba(12, 22, 20, 0.4);
          backdrop-filter: none;
          -webkit-backdrop-filter: none;
        }
        .sheet {
          width: 100%;
          max-width: 560px;
          max-height: min(78dvh, 650px);
          padding: 13px 12px calc(12px + env(safe-area-inset-bottom));
          border-radius: 20px 20px 0 0;
          box-shadow: 0 -12px 34px rgba(0, 0, 0, 0.28);
          overflow: hidden;
        }
        .sheet h2 {
          font-size: 1.05rem;
          margin-bottom: 3px;
        }
        .sheet p {
          font-size: 0.78rem;
          line-height: 1.4;
        }
        .sheet .row {
          margin-top: 8px;
        }
        .skins {
          grid-template-columns: repeat(6, minmax(0, 1fr));
          gap: 7px;
          max-height: calc(min(78dvh, 650px) - 116px);
          padding: 4px 2px 14px;
          overscroll-behavior: contain;
          -webkit-overflow-scrolling: touch;
        }
        .skins button {
          min-height: 0;
          border-radius: 12px;
        }
        .skins button.wide {
          min-height: 44px;
        }

        /* 手機減少昂貴的陰影與模糊 */
        .skin-fly-preview {
          box-shadow:
            0 5px 14px rgba(0, 0, 0, 0.25),
            0 0 0 2px var(--accent);
        }
        .skin-trail-dot {
          box-shadow: 0 0 5px var(--gold);
        }
        .skin-paw-trail {
          filter: none;
        }
        .skin-arrival-particle {
          box-shadow: 0 0 4px var(--particle-color, var(--gold));
        }
      }

      @media (max-width: 370px) {
        .sub br {
          display: none;
        }
        .levels button {
          font-size: 0.69rem;
        }
        .status {
          font-size: 0.67rem;
          padding-left: 5px;
          padding-right: 5px;
        }
        .controls button {
          font-size: 0.65rem;
        }
        #newBtn::after {
          font-size: 0.65rem;
        }
      }

      /* 低效能模式由 JavaScript 自動加入 */
      html.low-fx .skin-paw-trail {
        display: none !important;
      }
      html.low-fx .skin-trail-dot {
        box-shadow: none;
        width: 6px !important;
        height: 6px !important;
      }
      html.low-fx .skin-arrival-particle:nth-of-type(n + 9) {
        display: none !important;
      }
      html.low-fx .board.skin-arrive {
        animation-duration: 0.28s;
      }

      /* 棋盤線條修正：圓角格子 + 單一 SVG 連續粗線層 */
      .boardWrap {
        position: relative;
      }
      .board {
        gap: 2px;
        padding: 3px;
        border: 0;
        border-radius: 14px;
        background: color-mix(in srgb, var(--ink) 28%, var(--card));
        overflow: hidden;
      }
      .cell {
        border: 0 !important;
        border-radius: clamp(4px, 1.4cqw, 10px) !important;
        overflow: hidden;
        background-clip: padding-box;
      }
      .region-lines {
        position: absolute;
        inset: 10px;
        z-index: 4;
        width: calc(100% - 20px);
        height: calc(100% - 20px);
        pointer-events: none;
        overflow: visible;
        filter: drop-shadow(0 1px 0 rgba(255, 255, 255, 0.18));
      }
      .region-lines .region-boundary {
        fill: none;
        stroke: var(--ink);
        stroke-width: 3.5;
        stroke-linecap: square;
        stroke-linejoin: round;
        vector-effect: non-scaling-stroke;
      }
      .region-lines .outer-boundary {
        fill: none;
        stroke: var(--ink);
        stroke-width: 4;
        stroke-linejoin: round;
        vector-effect: non-scaling-stroke;
      }
      @media (max-width: 600px), (hover: none) and (pointer: coarse) {
        .board {
          gap: 2px;
          padding: 3px;
          border-radius: 12px;
        }
        .cell {
          border-radius: 7px !important;
        }
        .region-lines {
          inset: 6px;
          width: calc(100% - 12px);
          height: calc(100% - 12px);
        }
        .region-lines .region-boundary {
          stroke-width: 3;
        }
        .region-lines .outer-boundary {
          stroke-width: 4;
        }
      }

      /* 貓咪小屋、飼料與好感度 */
      .pet-home {
        display: grid;
        gap: 12px;
        text-align: left;
      }
      .pet-hero {
        display: grid;
        grid-template-columns: 92px 1fr;
        gap: 12px;
        align-items: center;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--accent-soft);
      }
      .pet-avatar {
        width: 92px;
        aspect-ratio: 1;
        border-radius: 20px;
        background-color: var(--card);
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.14);
      }
      .pet-avatar.emoji-cat {
        display: grid;
        place-items: center;
        font-size: 58px;
      }
      .pet-name {
        font-weight: 800;
        font-size: 1rem;
      }
      .pet-level {
        margin-top: 3px;
        color: var(--muted);
        font-size: 0.76rem;
      }
      .affection-bar {
        height: 12px;
        margin-top: 9px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--line) 80%, transparent);
        overflow: hidden;
      }
      .affection-fill {
        height: 100%;
        width: var(--affection, 0%);
        border-radius: inherit;
        background: linear-gradient(90deg, #ff9fb5, #ff6f91);
        transition: width 0.35s ease;
      }
      .pet-affection {
        margin-top: 4px;
        font-size: 0.72rem;
        color: var(--muted);
      }
      .food-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }
      .food-card {
        display: grid;
        grid-template-columns: 40px 1fr auto;
        align-items: center;
        gap: 7px;
        min-height: 58px;
        padding: 8px !important;
        text-align: left;
      }
      .food-icon {
        font-size: 1.6rem;
      }
      .food-info b {
        display: block;
        font-size: 0.78rem;
      }
      .food-info small {
        color: var(--muted);
        font-size: 0.68rem;
      }
      .food-count {
        min-width: 26px;
        text-align: center;
        font-weight: 800;
        color: var(--accent);
      }
      .pet-collection-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 0.78rem;
        font-weight: 800;
      }
      .pet-collection {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 6px;
        max-height: 158px;
        overflow: auto;
        padding: 2px;
      }
      .pet-cat {
        position: relative;
        aspect-ratio: 1;
        padding: 3px !important;
        min-height: 0;
        border-radius: 12px;
      }
      .pet-cat .face {
        width: 100%;
        height: 100%;
      }
      .pet-cat.active {
        border: 2px solid var(--accent);
        background: var(--accent-soft);
      }
      .pet-cat-level {
        position: absolute;
        right: 1px;
        bottom: 1px;
        min-width: 18px;
        padding: 1px 3px;
        border-radius: 999px;
        background: rgba(20, 30, 28, 0.76);
        color: #fff;
        font-size: 0.56rem;
        text-align: center;
      }
      .reward-box {
        margin: 10px 0;
        padding: 10px;
        border-radius: 14px;
        background: var(--accent-soft);
        border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line));
        text-align: center;
      }
      .reward-foods {
        display: flex;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 7px;
      }
      .reward-food {
        padding: 5px 9px;
        border-radius: 999px;
        background: var(--card);
        font-weight: 700;
      }
      .feed-pop {
        animation: feedPop 0.42s cubic-bezier(0.2, 0.9, 0.3, 1);
      }
      @keyframes feedPop {
        0% {
          transform: scale(1);
        }
        45% {
          transform: scale(1.13) rotate(-2deg);
        }
        100% {
          transform: scale(1);
        }
      }
      @media (max-width: 600px), (hover: none) and (pointer: coarse) {
        .levels {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        .pet-hero {
          grid-template-columns: 78px 1fr;
        }
        .pet-avatar {
          width: 78px;
        }
        .food-grid {
          grid-template-columns: 1fr 1fr;
        }
        .food-card {
          grid-template-columns: 31px 1fr auto;
          gap: 5px;
        }
        .food-icon {
          font-size: 1.35rem;
        }
        .pet-collection {
          grid-template-columns: repeat(7, minmax(0, 1fr));
          max-height: 140px;
        }
      }

      /* v8 養成系統：初始領養、每日餵食、心情、互動、命名與合作圖鑑 */
      .onboarding-sheet {
        max-width: 520px;
      }
      .starter-intro {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 0.8rem;
        line-height: 1.55;
      }
      .starter-cats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 9px;
        max-height: 48dvh;
        overflow: auto;
        padding: 3px;
      }
      .starter-cat {
        display: grid;
        gap: 5px;
        place-items: center;
        padding: 7px !important;
        min-height: 0;
        border-radius: 14px;
      }
      .starter-cat .face {
        width: 100%;
        aspect-ratio: 1;
      }
      .starter-cat.selected {
        border: 3px solid var(--accent);
        background: var(--accent-soft);
        transform: scale(1.02);
      }
      .starter-name {
        font-size: 0.72rem;
        font-weight: 700;
      }
      .name-field {
        display: grid;
        gap: 5px;
        margin-top: 12px;
        text-align: left;
      }
      .name-field span {
        font-size: 0.76rem;
        font-weight: 800;
      }
      .name-field input {
        width: 100%;
        min-height: 46px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
        color: var(--ink);
        font: inherit;
        font-size: 1rem;
      }
      .mood-row {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-top: 5px;
        font-size: 0.75rem;
      }
      .mood-pill {
        padding: 3px 8px;
        border-radius: 999px;
        background: var(--card);
        font-weight: 800;
      }
      .daily-feed {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 9px 10px;
        border: 1px dashed var(--accent);
        border-radius: 13px;
        background: color-mix(in srgb, var(--accent-soft) 70%, transparent);
      }
      .daily-feed b {
        font-size: 0.78rem;
      }
      .daily-feed small {
        display: block;
        color: var(--muted);
        font-size: 0.66rem;
      }
      .daily-feed button {
        min-height: 38px;
        padding: 6px 10px;
      }
      .interaction-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 7px;
      }
      .interaction-row button {
        padding: 7px 4px;
        min-height: 43px;
        font-size: 0.75rem;
      }
      .pet-avatar-wrap {
        position: relative;
        width: max-content;
      }
      .pet-avatar-wrap .pet-avatar {
        cursor: pointer;
      }
      .pet-speech {
        position: absolute;
        left: 76%;
        bottom: 73%;
        z-index: 2;
        min-width: 92px;
        padding: 6px 8px;
        border-radius: 12px 12px 12px 3px;
        background: var(--card);
        border: 1px solid var(--line);
        box-shadow: 0 5px 13px rgba(0, 0, 0, 0.12);
        font-size: 0.66rem;
        font-weight: 700;
        opacity: 0;
        transform: translateY(5px) scale(0.9);
        pointer-events: none;
      }
      .pet-speech.show {
        animation: speechShow 1.45s ease forwards;
      }
      @keyframes speechShow {
        0% {
          opacity: 0;
          transform: translateY(7px) scale(0.88);
        }
        15%,
        75% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
        100% {
          opacity: 0;
          transform: translateY(-4px) scale(0.96);
        }
      }
      .pet-avatar.pet-bounce {
        animation: petBounce 0.58s cubic-bezier(0.2, 0.9, 0.3, 1);
      }
      @keyframes petBounce {
        0%,
        100% {
          transform: translateY(0) scale(1);
        }
        35% {
          transform: translateY(-10px) scale(1.08) rotate(-4deg);
        }
        65% {
          transform: translateY(0) scale(0.96) rotate(3deg);
        }
      }
      .pet-avatar.pet-wiggle {
        animation: petWiggle 0.62s ease;
      }
      @keyframes petWiggle {
        0%,
        100% {
          transform: rotate(0);
        }
        20% {
          transform: rotate(-7deg) scale(1.04);
        }
        40% {
          transform: rotate(7deg);
        }
        60% {
          transform: rotate(-5deg);
        }
        80% {
          transform: rotate(4deg);
        }
      }
      .pet-avatar.pet-sleep {
        animation: petSleep 1.1s ease;
      }
      @keyframes petSleep {
        0%,
        100% {
          transform: scale(1);
        }
        45% {
          transform: scale(0.92) translateY(5px);
          filter: brightness(0.88);
        }
      }
      .pet-stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }
      .pet-stat {
        padding: 7px;
        border: 1px solid var(--line);
        border-radius: 11px;
        text-align: center;
      }
      .pet-stat b {
        display: block;
        font-size: 0.9rem;
      }
      .pet-stat small {
        font-size: 0.62rem;
        color: var(--muted);
      }
      .collection-tabs {
        display: flex;
        gap: 6px;
      }
      .collection-tabs button {
        flex: 1;
        min-height: 38px;
        padding: 5px;
      }
      .pet-cat.locked {
        filter: grayscale(1);
        opacity: 0.43;
      }
      .pet-cat.locked .face {
        filter: blur(1px);
      }
      .pet-lock {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 1.1rem;
      }
      .pet-cat-name {
        position: absolute;
        left: 2px;
        right: 2px;
        bottom: 2px;
        padding: 1px 2px;
        border-radius: 6px;
        background: rgba(20, 30, 28, 0.72);
        color: #fff;
        font-size: 0.48rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-align: center;
      }
      .pet-cat-level {
        top: 1px;
        bottom: auto;
      }
      .rename-row {
        display: flex;
        gap: 7px;
        margin-top: 7px;
      }
      .rename-row input {
        flex: 1;
        min-width: 0;
        padding: 7px 9px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--card);
        color: var(--ink);
      }
      .rename-row button {
        min-height: 38px;
        padding: 5px 9px;
      }
      @media (max-width: 600px), (hover: none) and (pointer: coarse) {
        .starter-cats {
          grid-template-columns: repeat(3, minmax(0, 1fr));
          max-height: 44dvh;
        }
        .pet-speech {
          left: 68%;
          bottom: 76%;
        }
        .pet-stats {
          gap: 4px;
        }
        .pet-stat {
          padding: 5px 3px;
        }
        .interaction-row button {
          font-size: 0.69rem;
        }
      }

      /* v9 成長階段、稱號、圖鑑篩選與排序 */
      .growth-badges {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-top: 6px;
      }
      .growth-badge,
      .title-badge {
        padding: 3px 8px;
        border-radius: 999px;
        font-size: 0.65rem;
        font-weight: 800;
      }
      .growth-badge {
        background: linear-gradient(135deg, #ffe8a3, #ffc86b);
        color: #684500;
      }
      .title-badge {
        background: linear-gradient(
          135deg,
          var(--accent),
          color-mix(in srgb, var(--accent) 65%, #7f8cff)
        );
        color: #fff;
      }
      .growth-track {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 4px;
        margin-top: 8px;
      }
      .growth-step {
        padding: 5px 2px;
        border-radius: 9px;
        background: color-mix(in srgb, var(--line) 65%, transparent);
        text-align: center;
        font-size: 0.56rem;
        color: var(--muted);
      }
      .growth-step.done {
        background: var(--accent-soft);
        color: var(--ink);
        font-weight: 800;
      }
      .growth-step.current {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      .growth-icon {
        display: block;
        font-size: 1rem;
        margin-bottom: 1px;
      }
      .collection-tools {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 7px;
      }
      .collection-tools label {
        display: grid;
        gap: 3px;
        font-size: 0.63rem;
        color: var(--muted);
      }
      .collection-tools select {
        width: 100%;
        min-height: 38px;
        padding: 6px 8px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--card);
        color: var(--ink);
        font: inherit;
        font-size: 0.72rem;
      }
      .pet-cat-stage {
        position: absolute;
        left: 2px;
        top: 2px;
        padding: 1px 4px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.86);
        color: #463900;
        font-size: 0.48rem;
        font-weight: 800;
      }
      .pet-cat-level {
        right: 2px;
      }
      .collection-empty {
        grid-column: 1/-1;
        padding: 18px;
        text-align: center;
        color: var(--muted);
        font-size: 0.75rem;
      }
      .title-list {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        margin-top: 5px;
      }
      .mini-title {
        padding: 2px 5px;
        border-radius: 999px;
        background: var(--card);
        border: 1px solid var(--line);
        font-size: 0.56rem;
      }
      @media (max-width: 600px), (hover: none) and (pointer: coarse) {
        .growth-track {
          gap: 3px;
        }
        .growth-step {
          font-size: 0.5rem;
          padding: 4px 1px;
        }
        .collection-tools {
          grid-template-columns: 1fr 1fr;
        }
        .pet-cat-stage {
          font-size: 0.43rem;
        }
      }

      /* v10 稱號條件提示、圖鑑偏好保存、成長階段升級動畫 */
      .title-panel {
        display: grid;
        gap: 6px;
        margin-top: 7px;
      }
      .title-panel summary {
        cursor: pointer;
        font-size: 0.68rem;
        font-weight: 800;
        color: var(--accent);
        list-style: none;
      }
      .title-panel summary::-webkit-details-marker {
        display: none;
      }
      .title-panel summary::before {
        content: "▸";
        display: inline-block;
        margin-right: 5px;
        transition: transform 0.2s ease;
      }
      .title-panel[open] summary::before {
        transform: rotate(90deg);
      }
      .title-condition-list {
        display: grid;
        gap: 5px;
        padding: 7px;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: color-mix(in srgb, var(--card) 88%, transparent);
      }
      .title-condition {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        align-items: center;
        font-size: 0.62rem;
      }
      .title-condition b {
        font-size: 0.65rem;
      }
      .title-condition small {
        color: var(--muted);
        line-height: 1.35;
      }
      .title-condition.unlocked {
        color: var(--accent);
      }
      .title-condition.locked {
        opacity: 0.72;
      }
      .title-state {
        white-space: nowrap;
        font-weight: 800;
      }
      .title-progress {
        grid-column: 1/-1;
        height: 5px;
        border-radius: 999px;
        background: var(--line);
        overflow: hidden;
      }
      .title-progress > i {
        display: block;
        height: 100%;
        width: var(--title-progress, 0%);
        background: linear-gradient(90deg, var(--accent), #ff9fb5);
        border-radius: inherit;
      }
      .collection-saved-note {
        grid-column: 1/-1;
        text-align: right;
        color: var(--muted);
        font-size: 0.56rem;
        margin-top: -2px;
      }
      .growth-up-overlay {
        position: fixed;
        inset: 0;
        z-index: 10020;
        display: grid;
        place-items: center;
        pointer-events: none;
        background: radial-gradient(circle, rgba(255, 244, 180, 0.25), transparent 56%);
        animation: growthOverlay 1.9s ease forwards;
      }
      .growth-up-card {
        display: grid;
        place-items: center;
        gap: 7px;
        min-width: 210px;
        padding: 22px 26px;
        border: 2px solid #ffd36b;
        border-radius: 24px;
        background: color-mix(in srgb, var(--card) 94%, transparent);
        box-shadow:
          0 14px 45px rgba(0, 0, 0, 0.3),
          0 0 40px rgba(255, 205, 83, 0.55);
        animation: growthCard 1.9s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
      }
      .growth-up-cat {
        width: 110px;
        aspect-ratio: 1;
        border-radius: 24px;
        box-shadow: 0 0 0 7px rgba(255, 214, 102, 0.3);
        animation: growthCat 1.15s ease-in-out 2;
      }
      .growth-up-stage {
        font-size: 1.15rem;
        font-weight: 900;
        color: var(--accent);
      }
      .growth-up-title {
        font-size: 0.76rem;
        color: var(--muted);
      }
      .growth-spark {

      function regionColor(r) {
        return (
          document.documentElement.dataset.theme === "dark" ? REGION_COLORS_DARK : REGION_COLORS
        )[r % 9];
      }
      function renderRegionLines() {
        const wrap = document.querySelector(".boardWrap");
        wrap.querySelector(".region-lines")?.remove();
        const n = state.n,
          ns = "http://www.w3.org/2000/svg";
        const svg = document.createElementNS(ns, "svg");
        svg.classList.add("region-lines");
        svg.setAttribute("viewBox", `0 0 ${n} ${n}`);
        svg.setAttribute("preserveAspectRatio", "none");
        svg.setAttribute("aria-hidden", "true");

        // 以每個色塊的封閉輪廓繪製，而非逐格拼接線段。
        // 封閉路徑搭配 round join，可讓凸角與凹角都真正呈現圓角。
        const regions = [...new Set(state.owner)];
        const key = (x1, y1, x2, y2) => `${x1},${y1},${x2},${y2}`;
        const pointKey = (p) => `${p[0]},${p[1]}`;
        for (const reg of regions) {
          const edges = new Map();
          const add = (a, b) => edges.set(key(a[0], a[1], b[0], b[1]), { a, b });
          for (let r = 0; r < n; r++)
            for (let c = 0; c < n; c++) {
              const i = indexOf(n, r, c);
              if (state.owner[i] !== reg) continue;
              // 順時針加入色塊外緣，確保相鄰格子的內邊不會被畫出。
              if (r === 0 || state.owner[i - n] !== reg) add([c, r], [c + 1, r]);
              if (c === n - 1 || state.owner[i + 1] !== reg) add([c + 1, r], [c + 1, r + 1]);
              if (r === n - 1 || state.owner[i + n] !== reg) add([c + 1, r + 1], [c, r + 1]);
              if (c === 0 || state.owner[i - 1] !== reg) add([c, r + 1], [c, r]);
            }
          const starts = new Map();
          for (const e of edges.values()) {
            const k = pointKey(e.a);
            if (!starts.has(k)) starts.set(k, []);
            starts.get(k).push(e);
          }
          const used = new Set(),
            commands = [];
          for (const first of edges.values()) {
            const fk = key(...first.a, ...first.b);
            if (used.has(fk)) continue;
            let cur = first,
              guard = edges.size + 2;
            commands.push(`M ${cur.a[0]} ${cur.a[1]}`);
            while (cur && guard-- > 0) {
              const ck = key(...cur.a, ...cur.b);
              if (used.has(ck)) break;
              used.add(ck);
              commands.push(`L ${cur.b[0]} ${cur.b[1]}`);
              const choices = (starts.get(pointKey(cur.b)) || []).filter(
                (e) => !used.has(key(...e.a, ...e.b)),
              );
              cur = choices[0] || null;
            }
            commands.push("Z");
          }
          if (commands.length) {
            const path = document.createElementNS(ns, "path");
            path.classList.add("region-boundary");
            path.setAttribute("d", commands.join(" "));
            svg.append(path);
          }
        }

        wrap.append(svg);
      }

      function playSkinTone({

        giveHint,
        catsOnBoard,
        board: () => $("board"),
        todayKey,
      };
      (function boot() {
        const theme = localStorage.getItem(LS.theme);
        if (theme) {
          document.documentElement.dataset.theme = theme;
          $("themeBtn").textContent = theme === "dark" ? "☀️" : "🌙";
        } else if (matchMedia("(prefers-color-scheme:dark)").matches) {
          document.documentElement.dataset.theme = "dark";
          $("themeBtn").textContent = "☀️";
        }
        state.skin = petData.initialized
          ? localStorage.getItem(LS.skin) || petData.selected || "0"
          : "emoji";
        const autoX = localStorage.getItem(LS.autoX);
        state.autoX = autoX === null ? true : autoX === "1";
        $("autoXBtn").classList.toggle("on", state.autoX);
        $("autoXBtn").textContent = state.autoX ? "自動打叉" : "自動打叉：關";
        setMode(localStorage.getItem("meowdoku.mode") === "cat" ? "cat" : "mark");
        if (!loadResume()) newGame({ n: 5 });
        else if (state.daily && state.dailyKey !== todayKey()) newGame({ n: 5 });
        updateSkinCooldownButton();
        if (petData.initialized) syncGrowthStages();
        if (!petData.initialized) setTimeout(showStarterSetup, 180);
        if ("serviceWorker" in navigator && location.protocol !== "file:")
          navigator.serviceWorker.register("./sw.js").catch(() => {});
      })();
    </script>
  </body>
</html>
